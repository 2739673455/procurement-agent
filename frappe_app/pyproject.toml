[project]
name = "buying_ai"
version = "0.1.0"
description = "Buying AI assistant for ERPNext"
authors = [{name = "Buying AI"}]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["buying_ai"]
include-package-data = false

[tool.setuptools.package-dir]
buying_ai = "."

[tool.setuptools.package-data]
buying_ai = ["modules.txt", "patches.txt", "package.json", "package-lock.json", "tsconfig.json", "public/frontend/*.ts", "public/frontend/*.tsx", "public/frontend/components/*.tsx", "public/frontend/*.css"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
