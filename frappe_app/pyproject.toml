[project]
name = "procurement_assistant"
version = "0.1.0"
description = "Contextual procurement assistant for ERPNext"
authors = [{name = "Procurement Agent"}]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["procurement_assistant"]
include-package-data = false

[tool.setuptools.package-dir]
procurement_assistant = "."

[tool.setuptools.package-data]
procurement_assistant = ["modules.txt", "patches.txt", "public/js/*.js", "public/css/*.css"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
