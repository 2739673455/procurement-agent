name: procurement-assistant

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procurement_assistant
      POSTGRES_USER: atguigu
      POSTGRES_PASSWORD: 123123
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d procurement_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
