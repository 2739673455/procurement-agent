[project]
name = "procurement-assistant"
version = "0.1.0"
description = "ERPNext procurement assistant service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agentscope[service,storage-sql,workspace-docker]>=2.0.9,<2.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1,<1",
    "loguru>=0.7.3,<1",
    "omegaconf>=2.3.0,<3",
    "openai>=2,<3",
    "psycopg[binary]>=3.3.4,<4",
    "pypdf>=6,<7",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.1,<2",
    "sqlalchemy[asyncio]>=2.0.46,<3",
    "uvicorn>=0.52.4",
]

[tool.ruff]
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportIncompatibleVariableOverride = "error"

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "pytest>=8,<10",
    "pyright>=1.1.414",
    "ruff>=0.16.7",
]
