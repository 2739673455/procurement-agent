# 所有 MCP 服务写在 servers 下；框架的 name 自动使用外层服务配置名。
# 在 agents.yaml 的角色中用 mcps: [files, documents] 引用对应服务。
# 需要启用时，将 servers: {} 替换为以下结构，并填写实际命令或地址：
#
# servers:
#   files:                         # 服务配置名，可自行命名。
#     is_stateful: true            # STDIO 必须为 true。
#     mcp_config:
#       type: stdio_mcp
#       command: python3           # 实际 MCP 服务的启动命令。
#       args: [/workspace/mcp/server.py] # 替换为实际启动参数。
#   documents:
#     is_stateful: false
#     mcp_config:
#       type: http_mcp
#       url: https://example.com/mcp # 替换为实际 MCP 服务地址。
#
# env 或 headers 中的密钥通过 ${oc.env:变量名} 引用。
servers: {}
