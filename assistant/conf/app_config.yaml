# 日志输出配置。
log:
  level: INFO # 日志级别。
  rotation: 10 MB # 单个日志文件的滚动大小。

# Assistant HTTP 服务配置。
server:
  host: "" # 留空时自动检测 Docker 网桥网关。
  port: 8100 # HTTP 服务监听端口。

# AgentScope 原生 SQL 存储：会话、AgentState、完整消息及模型配置引用。
# 框架启动时创建缺失的数据表；密钥从环境变量读取，支持通过 .env 配置。
postgresql:
  host: "127.0.0.1" # 数据库主机地址。
  port: 5433 # 数据库连接端口。
  user: "atguigu" # 数据库用户名。
  password: ${oc.env:ASSISTANT_PG_PASSWORD} # 从环境变量读取数据库密码。
  database: "procurement_assistant" # 数据库名称。

# ERPNext 接口和站点配置。
erpnext:
  base_url: "http://127.0.0.1:8000" # ERPNext 接口地址。
  site: "development.localhost" # ERPNext 站点名称。
  timeout_seconds: 5 # ERPNext 请求超时，单位为秒。

# AgentScope Docker 工作空间：每个用户一个容器，会话默认目录为 /workspace/sessions/<session_id>/。
workspace:
  base_image: python:3.13-slim # 提供 python3 的基础镜像；框架自动构建并缓存工具镜像。
  node_version: "22" # 容器内 Node.js 的主版本，用于运行 Node.js 工具和 MCP 服务。
  extra_pip: [pypdf] # 预装到容器内的额外 Python 包，例如 pandas、pypdf。
  ttl_seconds: 3600 # 工作空间空闲多久后回收容器，单位为秒；保留挂载的工作文件。
  sweep_interval_seconds: 300 # 框架扫描空闲工作空间的间隔，单位为秒。

# 所有角色共用的运行配置。
runtime:
  timezone: Asia/Shanghai # 提示词中时间信息使用的时区。
  context_ttl_seconds: 3600 # 登录上下文有效期；恢复或发送时重新核验并绑定。

# 模型选择及各模型的连接参数和能力配置。
lm_config:
  active: deepseek-deepseek-flash # 当前使用的模型配置名，对应 models 中的条目。
  # 可选模型配置集合。
  models:
    # DeepSeek 官方接口的模型配置。
    deepseek-deepseek-flash:
      model_provider: deepseek # 模型服务商，决定消息格式化方式。
      model: deepseek-flash # 服务商提供的模型标识。
      base_url: https://api.deepseek.com # 模型接口地址。
      api_key: ${oc.env:DEEPSEEK_API_KEY} # 从环境变量读取必填的模型密钥。
      timeout_seconds: 30 # 模型请求超时，单位为秒。
      image_inputs: true # 是否支持图片输入。
      context_size: 1048576 # AgentScope 上下文 token 预算；null 时使用 32768。
      params: {} # 透传到 Chat Completions 请求体的附加参数，例如 thinking、reasoning_effort、max_tokens。
